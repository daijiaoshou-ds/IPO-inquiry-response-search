[package]
name = "search-core"
version = "0.1.0"
edition = "2021"
description = "问询检索的 Rust 检索内核（原型）：4-gram 倒排索引 + IDF 加权打分"

[dependencies]
memmap2 = "0.9.12"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
